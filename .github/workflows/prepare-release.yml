name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Release target branch
        required: true
        default: main
        type: string
      package:
        description: Package to release
        required: true
        default: vite
        type: choice
        options:
          - vite
          - create-vite
          - plugin-legacy
      release:
        description: Release type
        required: true
        default: next
        type: choice
        options:
          - next
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
      version:
        description: Specify exact version instead of release type
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target_branch }}-${{ inputs.package }}-${{ inputs.version || inputs.release }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: github.repository == 'vitejs/vite'
    name: Prepare release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate target branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          if [[ "$TARGET_BRANCH" != "main" && ! "$TARGET_BRANCH" =~ ^v[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Target branch must be main or a v* release branch (for example, v8 or v8.0)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set node version to 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install deps
        run: pnpm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Prepare release
        id: prepare
        env:
          RELEASE: ${{ inputs.version || inputs.release }}
          RELEASE_PACKAGE: ${{ inputs.package }}
        run: |
          node scripts/prepare-release.ts "$RELEASE_PACKAGE" "$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        uses: vitejs/release-scripts/action/release-pr@005dab4c647ff12519bfd076a595b2be33be8f6b # v1.9.2
        with:
          token: ${{ github.token }}
          package-name: ${{ inputs.package }}
          package-path: packages/${{ inputs.package }}
          pr-body: ${{ steps.prepare.outputs.pr_body }}
          tag: ${{ steps.prepare.outputs.tag }}
          target-branch: ${{ inputs.target_branch }}
          version: ${{ steps.prepare.outputs.version }}
