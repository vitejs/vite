name: Semantic Pull Request

on:
  # zizmor: ignore[dangerous-triggers]
  # SAFETY: pull_request_target is used here because:
  # - The workflow does NOT check out PR code
  # - Only PR title is read
  # - No PR-supplied code is executed
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  main:
    if: github.repository == 'vitejs/vite'
    runs-on: ubuntu-slim
    name: Semantic Pull Request
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
