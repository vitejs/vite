packages:
  - 'packages/*'
  - 'playground/**'
  - 'packages/**/__tests__/**'
  - docs

hoistPattern:
  - postcss # package/vite
  - pug # playground/tailwind: @vue/compiler-sfc
shellEmulator: true
autoInstallPeers: false
dedupeInjectedDeps: false
overrides:
  vite: 'workspace:*'
  debug: 'npm:obug@^1.0.2'
  # Volar uses the TypeScript 6 compiler API; its broad optional peer includes TS 7.
  '@volar/typescript>typescript@>=7': '-'
  '@volar/language-service>typescript@>=7': '-'
patchedDependencies:
  "sirv@3.0.2": "patches/sirv@3.0.2.patch"
  "chokidar@3.6.0": "patches/chokidar@3.6.0.patch"
  "dotenv-expand@13.0.0": "patches/dotenv-expand@13.0.0.patch"
peerDependencyRules:
  allowedVersions:
    vite: "*"
packageExtensions:
  sass-embedded:
    peerDependencies:
      source-map-js: "*"
    peerDependenciesMeta:
      source-map-js:
        optional: true
  '@rollup/plugin-dynamic-import-vars':
    dependencies:
      '@types/estree': ^1.0.0
  '@volar/typescript':
    dependencies:
      '@volar/language-service': 2.4.28
      typescript: ~6.0.3
  '@volar/language-service':
    dependencies:
      typescript: ~6.0.3
  '@vue/compiler-core':
    dependencies:
      '@babel/types': ^7.29.8
  '@vue/compiler-sfc':
    dependencies:
      '@babel/types': ^7.29.8
  '@vue/language-core':
    dependencies:
      '@vue/compiler-sfc': ^3.5.0
      typescript: ~6.0.3
allowBuilds:
  core-js: false
  vue-demi: false
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  playwright-chromium: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - rolldown
  - '@rolldown/binding-*'
  - '@vitejs/devtools'
  - '@vitejs/devtools-*'
  - launch-editor-middleware@2.14.2
  - launch-editor@2.14.2
  - resolve.exports@2.0.4
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - semver@6.3.1

dedupePeers: true
